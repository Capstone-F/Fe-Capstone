name: Sync Upstream

on:
  schedule:
    # GitHub cron uses UTC. 11:00 UTC is 18:00 in Vietnam (UTC+7).
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync PR
    if: github.repository != 'Capstone-F/Fe-Capstone'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-upstream-main
      UPSTREAM_REPOSITORY: Capstone-F/Fe-Capstone

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch upstream main

      - name: Detect upstream changes
        id: changes
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH" origin/main
          git merge --no-edit upstream/main

          git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pull_request
        shell: bash
        run: |
          pr_url="$(
            gh pr list \
              --base main \
              --head "$SYNC_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"

          if [[ -z "$pr_url" ]]; then
            pr_url="$(
              gh pr create \
                --base main \
                --head "$SYNC_BRANCH" \
                --title "chore: sync upstream main" \
                --body "Automated daily sync from \`$UPSTREAM_REPOSITORY:main\`. Review the diff and merge only after the required CI check passes."
            )"
          fi

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Upstream sync PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger CI for sync branch
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: gh workflow run ci.yml --ref "$SYNC_BRANCH"
